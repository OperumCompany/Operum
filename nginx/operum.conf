upstream operum_api {
    server api:8001;
}

server {
    listen 80;
    server_name operum.ktrixtech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name operum.ktrixtech.com;

    ssl_certificate /etc/letsencrypt/live/operum.ktrixtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operum.ktrixtech.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OperumSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://operum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
