services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env.production
        required: false
    environment:
      OPERUM_DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - operum_data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env.production
        required: false
    environment:
      OPERUM_DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.analysis_worker", "--workspace", "/app"]
    volumes:
      - operum_data:/app/data
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/letsencrypt/live/operum.ktrixtech.com.br/fullchain.pem ]; then
          mkdir -p /etc/letsencrypt/live/operum.ktrixtech.com.br
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/operum.ktrixtech.com.br/privkey.pem \
            -out /etc/letsencrypt/live/operum.ktrixtech.com.br/fullchain.pem \
            -subj "/CN=operum.ktrixtech.com.br"
        fi
        nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  operum_data:
  redis_data:
  certbot_www:
  letsencrypt:
